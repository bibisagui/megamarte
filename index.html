<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ecommerce megamarte</title>
	<link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
<header>
	<section class="topo">
		<div class="frase">
			<p>Welcome to worldwide Megamart!</p>
		</div>
		<div class="opcoes">
			<a href="#"><i class="fa-solid fa-location-dot">Deliver to <strong>423651</strong></i></a>
			<a href="#"><i class="fa-solid fa-truck">Track your order</i></a>
			<a href="#"><i class="fa-solid fa-tag">All Offers</i></a>
		</div>
	</section>
	<section class="cabecalho">
		<div class="menu">
			<i class="fa-solid fa-bars menu-toggle"></i>
			<h1 class="titulo">MegaMart</h1>
		</div>
		<div class="busca">
			<i class="fa-solid fa-magnifying-glass"></i>
			<input type="text" placeholder="Search essentials, groceries and more...">
		</div>
		<div class="acoes">
			<a href="#"><i class="fa-regular fa-user"></i>Sign Up/Sign In</a>
			<a href="#"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
		</div>
		<hr>
	</section>
	<section class="categorias">
		<div class="categorias-div">
			<a href="#" class="nav-item active">Groceries<span class="arrow">&#10095;</span></a>
			<a href="#" class="nav-item ">Premium Fruits<span class="arrow">&#10095;</span></a>
			<a href="#" class="nav-item ">Home & Kitchen<span class="arrow">&#10095;</span></a>
			<a href="#" class="nav-item ">Fashion<span class="arrow">&#10095;</span></a>
			<a href="#" class="nav-item ">Eletronics<span class="arrow">&#10095;</span></a>
			<a href="#" class="nav-item ">Home Improvemente<span class="arrow">&#10095;</span></a>
			<a href="#" class="nav-item ">Sports, Toys & Luggage<span class="arrow">&#10095;</span></a>
		</div>
	</section>
	<section class="banner">
		<button class="nav-btn.left prev-btn"><</button>
		<button class="nav-btn.right prev-btn">></button>
		<img src="assets/banner.png">															
	</section>
</header>
</body>
</html>
